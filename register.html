<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – ShopEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav id="main-nav"></nav>

  <main>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon">🎉</div>
          <h1>Create Account</h1>
          <p>Join ShopEase and start shopping today</p>
        </div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" name="reg-name" class="form-control"
                   placeholder="John Doe" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" name="reg-email" class="form-control"
                   placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="reg-password" class="form-control"
                   placeholder="At least 6 characters" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" name="reg-confirm" class="form-control"
                   placeholder="Repeat your password" required autocomplete="new-password">
          </div>
          <div id="reg-error" class="field-error"></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">
            Create Account →
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
