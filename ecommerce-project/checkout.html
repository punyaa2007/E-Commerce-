<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout – ShopEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav id="main-nav"></nav>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Checkout</h1>
        <p>Complete your order securely</p>
      </div>
    </div>

    <div class="container">
      <div class="checkout-layout">
        <!-- Checkout Form -->
        <div class="checkout-form-card">
          <h2>📦 Shipping Information</h2>
          <form id="checkout-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="ch-name">Full Name</label>
                <input type="text" id="ch-name" name="ch-name" class="form-control"
                       placeholder="John Doe" required>
              </div>
              <div class="form-group">
                <label for="ch-email">Email</label>
                <input type="email" id="ch-email" name="ch-email" class="form-control"
                       placeholder="you@example.com" required>
              </div>
            </div>

            <div class="form-group">
              <label for="ch-address">Street Address</label>
              <input type="text" id="ch-address" name="ch-address" class="form-control"
                     placeholder="123 Main Street, Apt 4B" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="ch-city">City</label>
                <input type="text" id="ch-city" name="ch-city" class="form-control"
                       placeholder="New York" required>
              </div>
              <div class="form-group">
                <label for="ch-state">State / Province</label>
                <input type="text" id="ch-state" name="ch-state" class="form-control"
                       placeholder="NY" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="ch-zip">ZIP / Postal Code</label>
                <input type="text" id="ch-zip" name="ch-zip" class="form-control"
                       placeholder="10001" required>
              </div>
              <div class="form-group">
                <label for="ch-country">Country</label>
                <input type="text" id="ch-country" name="ch-country" class="form-control"
                       value="United States" required>
              </div>
            </div>

            <h2 style="margin:24px 0 16px;padding-top:16px;border-top:1px solid var(--border);">
              💳 Payment Method
            </h2>

            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="ch-payment" value="Credit Card" checked>
                <span class="payment-icon">💳</span>
                <span>Credit Card</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="ch-payment" value="PayPal">
                <span class="payment-icon">🅿️</span>
                <span>PayPal</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="ch-payment" value="Cash on Delivery">
                <span class="payment-icon">💵</span>
                <span>Cash on Delivery</span>
              </label>
            </div>

            <div style="margin-top:24px;padding:14px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:var(--radius-sm);font-size:.85rem;color:#065f46;">
              🔒 <strong>Secure Checkout</strong> – Your information is safe. (Demo mode – no real payment processed.)
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">
              Place Order →
            </button>
          </form>
        </div>

        <!-- Order Summary -->
        <div id="checkout-summary">
          <div style="text-align:center;padding:40px;color:var(--text-muted)">Loading summary...</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>© 2024 ShopEase. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
